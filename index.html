<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal de Juegos</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #1e272e, #111);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .menu-container {
            text-align: center;
            background: rgba(34, 34, 34, 0.9);
            padding: 40px 60px;
            border-radius: 16px;
            border: 2px solid #444;
            box-shadow: 0 0 40px rgba(0, 168, 255, 0.2);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #00a8ff;
            text-shadow: 0 0 10px rgba(0, 168, 255, 0.4);
        }

        p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 35px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: #00a8ff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 168, 255, 0.3);
            display: inline-block;
        }

        .btn:hover {
            background-color: #0097e6;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 168, 255, 0.5);
        }

        .btn-oca {
            background-color: #e84118;
            box-shadow: 0 4px 15px rgba(232, 65, 24, 0.3);
        }

        .btn-oca:hover {
            background-color: #c23616;
            box-shadow: 0 6px 20px rgba(232, 65, 24, 0.5);
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>SALA DE JUEGOS</h1>
        <p>Selecciona el juego al que quieres jugar hoy</p>
        
        <div class="button-group">
            <!-- Enlace al juego de la Oca -->
            <a href="oca.html" class="btn btn-oca">🎲 Juego de la Oca</a>
            
            <!-- Enlace al juego estilo Rocket League -->
            <a href="roquet.html" class="btn">🚗 Rocket League 2D</a>
        </div>
    </div>

</body>
</html>
